<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}StayTrace{% endblock %}</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/options.css"></head><body>
<header><a class="brand" href="/search">StayTrace</a><nav><a href="/search">호텔 찾기</a><a href="/admin">데이터 콘솔</a><a href="/end">탐색 종료</a></nav></header><main>{% block content %}{% endblock %}</main>
<script>async function eventLog(event_name,page_name,search_id=null,hotel_id=null,properties={}){await fetch('/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_name,page_name,search_id,hotel_id,properties})})} function wish(btn,s,h){let on=btn.dataset.on==='1';eventLog(on?'wishlist_remove':'wishlist_add','results',s,h);btn.dataset.on=on?'0':'1';btn.textContent=on?'♡ 찜':'♥ 찜됨';btn.classList.toggle('on',!on)}</script>{% block scripts %}{% endblock %}</body></html>
