{% extends 'base.html' %}
{% block title %}호텔 검색 · StayTrace{% endblock %}
{% block content %}
<section class="searchHero"><span class="eyebrow">JAPAN STAYS</span><h1>어디로 떠나시나요?</h1><p>로그인 없이 바로 검색하고, 원하는 숙박 조건을 자유롭게 조합하세요.</p></section>
<form class="searchbox" method="post" action="/search" id="searchForm">
<div class="primary"><label>목적지<select name="region"><option>Tokyo</option><option>Osaka</option><option>Kyoto</option><option>Fukuoka</option><option>Sapporo</option></select></label><label>체크인<input type="date" name="checkin" required value="{{today}}"></label><label>체크아웃<input type="date" name="checkout" required></label><label>인원<input name="guests" type="number" value="2" min="1" max="12"></label><label>객실<input name="rooms" type="number" value="1" min="1" max="6"></label></div>
<details open><summary onclick="eventLog('filter_open','search')">가격과 숙소 조건</summary><div class="filters"><label>숙소 유형<select name="type"><option value="">전체</option><option>Hotel</option><option>Ryokan</option><option>Resort</option><option>Apartment</option><option>Hostel</option><option>Guesthouse</option></select></label><label>최소 성급<select name="grade"><option value="">전체</option><option value="2">2성 이상</option><option value="3">3성 이상</option><option value="4">4성 이상</option><option value="5">5성</option></select></label><label>고객 평점<select name="min_rating"><option value="">전체</option><option value="9">최고 9+</option><option value="8">매우 좋음 8+</option><option value="7">좋음 7+</option></select></label><label>최소 가격<input name="min_price" type="number" step="5000" placeholder="50,000"></label><label>최대 가격<input name="max_price" type="number" step="5000" placeholder="250,000"></label><label>호텔 체인<select name="chain"><option value="">전체</option><option>Sakura Stay</option><option>Nippon Grand</option><option>Urban Nest</option><option>Hoshi Resorts</option></select></label></div></details>
<details><summary onclick="eventLog('filter_open','search',null,null,{section:'facilities'})">예약 정책과 편의시설</summary><div class="optionGroups"><fieldset><legend>예약 정책</legend><label><input type="checkbox" name="free_cancellation"> 무료 취소</label><label><input type="checkbox" name="pay_at_hotel"> 현장 결제</label><label><input type="checkbox" name="breakfast"> 조식 포함</label></fieldset><fieldset><legend>인기 시설</legend><label><input type="checkbox" name="free_wifi"> 무료 Wi-Fi</label><label><input type="checkbox" name="parking"> 무료 주차</label><label><input type="checkbox" name="swimming_pool"> 수영장</label><label><input type="checkbox" name="spa"> 스파</label><label><input type="checkbox" name="public_bath"> 대욕장</label></fieldset><fieldset><legend>투숙객 맞춤</legend><label><input type="checkbox" name="family_room"> 가족 객실</label><label><input type="checkbox" name="pet_friendly"> 반려동물 동반</label><label>역까지 최대 거리<select name="distance"><option value="">제한 없음</option><option value="300">300m</option><option value="500">500m</option><option value="1000">1km</option></select></label></fieldset></div></details><button>검색하기 →</button></form>
{% endblock %}{% block scripts %}<script>let d=new Date();d.setDate(d.getDate()+1);document.querySelector('[name=checkout]').value=d.toISOString().slice(0,10);document.querySelectorAll('#searchForm input,#searchForm select').forEach(el=>{let previous=el.type==='checkbox'?el.checked:el.value;el.addEventListener('change',()=>{let value=el.type==='checkbox'?el.checked:el.value;eventLog('filter_change','search',null,null,{filter_name:el.name,previous_value:previous,new_value:value});if(el.type==='checkbox')eventLog(value?'filter_add':'filter_remove','search',null,null,{filter_name:el.name,previous_value:previous,new_value:value});previous=value})});</script>{% endblock %}
