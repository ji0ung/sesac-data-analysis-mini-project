<!doctype html><html><head><meta charset="utf-8"><title>Word QA preview</title>
<style>body{margin:0;background:#777}.docx-wrapper{padding:20px!important}.docx{box-shadow:0 2px 10px #333;margin-bottom:20px!important}</style>
</head><body><div id="container"></div><script src="jszip.min.js"></script><script src="docx-preview.min.js"></script><script>
fetch('report.docx').then(r=>r.arrayBuffer()).then(b=>docx.renderAsync(b,document.getElementById('container'),null,{inWrapper:true,breakPages:true,ignoreLastRenderedPageBreak:false})).then(()=>{document.body.dataset.ready='1';});
</script></body></html>
