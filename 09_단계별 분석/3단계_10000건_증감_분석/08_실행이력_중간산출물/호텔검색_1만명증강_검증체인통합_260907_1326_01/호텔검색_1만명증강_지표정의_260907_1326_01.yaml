definition_version: newref_v03_20260907
ordering:
  reference: "search_time ASC, search_id ASC"
  synthetic: "search_sequence ASC, search_time ASC, search_id ASC"
  simultaneous_timestamp: "explicit sequence first; otherwise search_id lexical tie-break"
zero_denominator: return_null
metrics:
  search_zero_rate:
    grain: search_id
    population: all distinct searches
    numerator: distinct searches where total_result_count=0
    denominator: all distinct searches
    deduplication: search_id
    sql_reference: "SELECT COUNT(DISTINCT CASE WHEN total_result_count=0 THEN search_id END), COUNT(DISTINCT search_id) FROM search"
    sql_synthetic: "SELECT COUNT(DISTINCT CASE WHEN total_result_count=0 THEN search_id END), COUNT(DISTINCT search_id) FROM Search"
  zero_followup_rate:
    grain: zero search transition
    population: all distinct zero searches
    numerator: zero searches having an adjacent next search
    denominator: all zero searches
    deduplication: one row per search_id
    sql_reference: "WITH o AS (SELECT search_id,session_id,total_result_count,LEAD(search_id) OVER(PARTITION BY session_id ORDER BY search_time,search_id) nxt FROM search) SELECT SUM(total_result_count=0 AND nxt IS NOT NULL),SUM(total_result_count=0) FROM o"
    sql_synthetic: "WITH o AS (SELECT search_id,session_id,total_result_count,LEAD(search_id) OVER(PARTITION BY session_id ORDER BY search_sequence,search_time,search_id) nxt FROM Search) SELECT SUM(total_result_count=0 AND nxt IS NOT NULL),SUM(total_result_count=0) FROM o"
  immediate_recovery_transition_rate:
    grain: adjacent transition whose source is a zero search
    population: zero searches having an adjacent next search
    numerator: eligible transitions whose next search total_result_count is positive
    denominator: eligible zero-to-next transitions
    deduplication: source search_id
    sql_reference: "WITH o AS (SELECT search_id,session_id,total_result_count,LEAD(total_result_count) OVER(PARTITION BY session_id ORDER BY search_time,search_id) nxt FROM search) SELECT SUM(total_result_count=0 AND nxt>0),SUM(total_result_count=0 AND nxt IS NOT NULL) FROM o"
    sql_synthetic: "WITH o AS (SELECT search_id,session_id,total_result_count,LEAD(total_result_count) OVER(PARTITION BY session_id ORDER BY search_sequence,search_time,search_id) nxt FROM Search) SELECT SUM(total_result_count=0 AND nxt>0),SUM(total_result_count=0 AND nxt IS NOT NULL) FROM o"
  first_zero_immediate_recovery_rate:
    grain: session first-zero transition
    population: first zero search in each session having an adjacent next search
    numerator: eligible first-zero transitions whose next search is positive
    denominator: eligible first-zero transitions
    deduplication: session_id
    sql_reference: "WITH o AS (SELECT search_id,session_id,search_time,total_result_count,LEAD(total_result_count) OVER(PARTITION BY session_id ORDER BY search_time,search_id) nxt FROM search),z AS (SELECT *,ROW_NUMBER() OVER(PARTITION BY session_id ORDER BY search_time,search_id) zr FROM o WHERE total_result_count=0) SELECT SUM(zr=1 AND nxt>0),SUM(zr=1 AND nxt IS NOT NULL) FROM z"
    sql_synthetic: "WITH o AS (SELECT search_id,session_id,total_result_count,LEAD(total_result_count) OVER(PARTITION BY session_id ORDER BY search_sequence,search_time,search_id) nxt,search_sequence FROM Search),z AS (SELECT *,ROW_NUMBER() OVER(PARTITION BY session_id ORDER BY search_sequence,search_id) zr FROM o WHERE total_result_count=0) SELECT SUM(zr=1 AND nxt>0),SUM(zr=1 AND nxt IS NOT NULL) FROM z"
  final_recovery_rate:
    grain: session_id
    population: sessions experiencing at least one zero search
    numerator: eligible sessions whose last search is positive
    denominator: eligible sessions
    deduplication: session_id
    sql_reference: "WITH o AS (SELECT session_id,total_result_count,ROW_NUMBER() OVER(PARTITION BY session_id ORDER BY search_time DESC,search_id DESC) rn,MAX(total_result_count=0) OVER(PARTITION BY session_id) z FROM search) SELECT SUM(rn=1 AND z=1 AND total_result_count>0),SUM(rn=1 AND z=1) FROM o"
    sql_synthetic: "WITH o AS (SELECT session_id,total_result_count,ROW_NUMBER() OVER(PARTITION BY session_id ORDER BY search_sequence DESC,search_time DESC,search_id DESC) rn,MAX(total_result_count=0) OVER(PARTITION BY session_id) z FROM Search) SELECT SUM(rn=1 AND z=1 AND total_result_count>0),SUM(rn=1 AND z=1) FROM o"
  card_h_search_rate:
    grain: search_id
    population: distinct positive-result searches
    numerator: positive searches with at least one hotel_detail_view for the rank-1 hotel
    denominator: distinct positive-result searches
    deduplication: repeated detail events count once per search
    sql_reference: "WITH p AS (SELECT DISTINCT search_id FROM search WHERE total_result_count>0),d AS (SELECT DISTINCT e.search_id FROM search_result r JOIN event e ON e.search_id=r.search_id AND e.hotel_id=r.hotel_id WHERE r.result_rank=1 AND e.event_type='hotel_detail_view') SELECT COUNT(DISTINCT d.search_id),COUNT(DISTINCT p.search_id) FROM p LEFT JOIN d USING(search_id)"
    sql_synthetic: "WITH p AS (SELECT DISTINCT search_id FROM Search WHERE total_result_count>0),d AS (SELECT DISTINCT e.search_id FROM SearchResult r JOIN ActionEvent e ON e.search_id=r.search_id AND e.hotel_id=r.hotel_id WHERE r.result_rank=1 AND e.event_type='hotel_detail_view') SELECT COUNT(DISTINCT d.search_id),COUNT(DISTINCT p.search_id) FROM p LEFT JOIN d USING(search_id)"
  card_h_event_rows:
    grain: event row
    population: rank-1 hotel detail events on positive searches
    numerator: matching event rows
    denominator: null
    deduplication: none
    sql_reference: "SELECT COUNT(*),NULL FROM search s JOIN search_result r ON r.search_id=s.search_id AND r.result_rank=1 JOIN event e ON e.search_id=s.search_id AND e.hotel_id=r.hotel_id AND e.event_type='hotel_detail_view' WHERE s.total_result_count>0"
    sql_synthetic: "SELECT COUNT(*),NULL FROM Search s JOIN SearchResult r ON r.search_id=s.search_id AND r.result_rank=1 JOIN ActionEvent e ON e.search_id=s.search_id AND e.hotel_id=r.hotel_id AND e.event_type='hotel_detail_view' WHERE s.total_result_count>0"
